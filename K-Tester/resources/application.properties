spring.application.name=publish-ride-service
#spring.datasource.url=jdbc:mysql://localhost:3306/ride_service
#spring.datasource.username=root
#spring.datasource.password=admin
server.port=8082
#spring.jpa.hibernate.ddl.auto=none

##KAFKA SETUP
# Bootstrap servers
spring.kafka.bootstrap-servers=localhost:9092

# com.test.Producer: serialize keys as strings and values as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# com.test.Consumer: deserialize keys as strings and values as JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JSON Deserializer: specify the class of the object being consumed
#spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.User
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=my-group

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.XADataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration

spring.kafka.producer.properties.allow.auto.create.topics=true
spring.kafka.admin.properties.auto.create.topics.enable=true